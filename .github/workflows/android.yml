name: Android build

on:
  push:
    branches: ["main", "feature/mounjaro-logger"]
  pull_request:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mounjaro-log-debug-keystore-v1
      - name: Test and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mounjaro-log-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
